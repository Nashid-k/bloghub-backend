name: Node.js CI

on:
  push:
    branches: [ main, feature/bloghub-product-evolution ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install API dependencies
        run: npm ci
        working-directory: server
      - name: Run unit tests
        run: npm test
        working-directory: server
      - name: Check API syntax
        run: node --check server.js
        working-directory: server
